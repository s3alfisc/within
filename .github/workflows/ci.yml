name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

# Cancel superseded PR runs; let every push to main run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check + Coverage (Linux)
    runs-on: ubuntu-latest
    # sccache content-addresses each compilation, so the dependency tree is
    # compiled once and reused across runs (rust-cache only caches downloads,
    # not compiled artifacts). rust-cache still caches the crate registry.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci
          cache: true
          # Only main writes the cache; PRs read it, avoiding churn/eviction.
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: pixi run -e ci cargo fmt --all -- --check
      - name: cargo clippy
        run: pixi run -e ci cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo deny
        run: pixi run -e ci cargo deny --locked check
      # Coverage instruments and runs the full workspace test suite + pytest,
      # so it subsumes the standalone `cargo test`/`pytest` steps.
      - name: coverage (cargo test + pytest, instrumented)
        run: pixi run -e ci coverage

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace, all features and targets, at the declared MSRV)
        run: cargo check --workspace --all-features --all-targets --locked

  semver:
    name: SemVer (public API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # within-py is a PyO3 cdylib whose real public surface is the Python ABI,
      # not a Rust library API, so cargo-semver-checks can't check it; scope to
      # the two crates actually published to crates.io.
      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2.9
        with:
          package: within, schwarz-precond

  platform:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # CI only needs pass/fail: dropping debug info shrinks artifacts (faster
      # Windows linking) and the target cache (faster restore).
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci
          cache: true
          # Only main writes the cache; PRs read it, avoiding churn/eviction.
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: pixi run -e ci cargo test --workspace --all-features --locked
      - name: pytest
        run: pixi run -e ci test

  r-bindings:
    name: R bindings (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: withinr/src/rust
      - name: cargo fmt (bridge crate)
        run: cargo fmt --manifest-path withinr/src/rust/Cargo.toml -- --check
      - name: cargo clippy (bridge crate against workspace within)
        working-directory: withinr/src
        run: >-
          R_HOME="$(R RHOME)" cargo clippy --locked --manifest-path rust/Cargo.toml
          --config 'patch.crates-io.within.path="../../crates/within"'
          -- -D warnings
      - name: Install package (dev mode, against the workspace crate)
        run: NOT_CRAN=true R CMD INSTALL withinr
      - name: Run R test suite
        run: Rscript withinr/tests/run_tests.R
