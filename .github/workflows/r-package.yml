name: R package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: R (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: 1.85.0
    env:
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: ""
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - name: Install shell checker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends devscripts
      - name: Install shell checker (macOS)
        if: runner.os == 'macOS'
        run: brew install checkbashisms
      - name: Install generation tools
        shell: Rscript {0}
        run: install.packages(c("rextendr", "usethis", "roxygen2", "pkgload"))
      - name: Regenerate glue from scratch and vendor dependencies
        shell: bash
        run: |
          rm -f withinr/R/extendr-wrappers.R withinr/NAMESPACE
          rm -f withinr/src/entrypoint.c withinr/src/rust/document.rs
          rm -f withinr/src/Makevars.in withinr/src/Makevars.win.in withinr/src/withinr-win.def
          rm -f withinr/configure withinr/configure.win withinr/cleanup withinr/cleanup.win
          rm -rf withinr/tools withinr/man
          Rscript scripts/prepare-r-package.R --vendor
      - name: Check generated bindings and Rust adapter
        shell: bash
        run: |
          git diff --exit-code -- withinr/R/extendr-wrappers.R withinr/src/entrypoint.c withinr/src/rust/document.rs
          cargo fmt --manifest-path withinr/src/rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path withinr/src/rust/Cargo.toml -- -D warnings
      - name: Build source package
        shell: bash
        run: R CMD build --no-build-vignettes withinr
      - name: Check source package offline
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
        run: R CMD check --as-cran --no-manual withinr_*.tar.gz
      - name: Reject check errors and warnings
        shell: Rscript {0}
        run: |
          status <- readLines("withinr.Rcheck/00check.log")
          if (any(grepl("^Status:.*(ERROR|WARNING)", status))) stop("R CMD check failed")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check-${{ matrix.os }}-${{ matrix.rust }}
          path: withinr.Rcheck
